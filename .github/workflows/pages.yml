# Publish the game to GitHub Pages on every push to main.
#
# The site is already static — no build step, no dependencies — so this just uploads
# the repository as it stands. Every reference in index.html is relative, so serving
# from a project subpath (/kana-no-michi/) needs no base-href fiddling.
#
# configure-pages runs with enablement: true, so the first successful run turns Pages
# on by itself and the repository needs no manual setting.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
